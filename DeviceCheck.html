<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>三商電腦 設備檢核回報</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #e8eef3;
    --grid: rgba(15, 92, 140, .08);
    --head: #12324a;
    --head-ink: #f2f7fb;
    --head-muted: #9fb8cb;
    --paper: #f9fbfc;
    --field: #ffffff;
    --ink: #17212b;
    --muted: #546475;
    --line: #c3cfda;
    --brand: #0f5c8c;
    --brand-ink: #ffffff;
    --ok: #16794c;   --ok-bg: #dcf2e6;
    --warn: #8f5400; --warn-bg: #fcebc8;
    --none: #475260; --none-bg: #e3e7ec;
    --err: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e151b;
      --grid: rgba(93, 180, 236, .06);
      --head: #0a2335;
      --head-ink: #eaf3fa;
      --head-muted: #86a3b9;
      --paper: #16212a;
      --field: #0f171d;
      --ink: #e6edf3;
      --muted: #93a4b3;
      --line: #2b3a47;
      --brand: #5db4ec;
      --brand-ink: #06202f;
      --ok: #5fd39a;   --ok-bg: #12372a;
      --warn: #f2b755; --warn-bg: #3a2c0f;
      --none: #aab4be; --none-bg: #26303a;
      --err: #ff8a80;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; min-height: 100vh; color: var(--ink); line-height: 1.7;
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
    background-color: var(--bg);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 28px 28px;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 0 16px; }

  /* 頁首 */
  header.top { background: var(--head); color: var(--head-ink); }
  /* 標誌區：標誌為藍色透明底，深色模式也維持白底以保持清晰 */
  .brand {
    background: #ffffff; border-bottom: 1px solid #d3dee7;
    padding: calc(10px + env(safe-area-inset-top, 0px)) 0 10px;
  }
  .logo { display: block; height: 40px; width: auto; }
  .titlebar { padding-top: 20px; }
  .top-in { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; padding-bottom: 20px; }
  h1 { margin: 0; font-size: 1.75rem; line-height: 1.3; font-weight: 700; letter-spacing: .04em; }
  .top p { margin: 6px 0 0; color: var(--head-muted); font-size: .92rem; }
  .progress { text-align: right; white-space: nowrap; color: var(--head-muted); font-size: .85rem; line-height: 1.3; }
  .progress strong { display: block; color: var(--head-ink); font-size: 1.9rem; font-weight: 700; }
  .bar { height: 4px; background: rgba(255,255,255,.14); }
  .bar i { display: block; height: 100%; width: 0; background: #5fd39a; transition: width .3s ease; }

  main { padding: 20px 0 8px; }

  /* 各區塊：左側色條表示完成狀態 */
  .sec {
    margin: 0 0 14px; padding: 14px 18px 18px;
    background: var(--paper); border: 1px solid var(--line);
    border-left: 6px solid var(--line); border-radius: 4px 14px 14px 4px;
  }
  .sec.done { border-left-color: var(--ok); }
  .sec.invalid { border-color: var(--err); border-left-color: var(--err); }
  .sec-h { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  h2 { margin: 0; font-size: 1.1rem; font-weight: 700; }
  .badge { font-size: .8rem; font-weight: 500; color: var(--muted); }
  .badge::before { content: "未填"; }
  .sec.done .badge { color: var(--ok); font-weight: 700; }
  .sec.done .badge::before { content: "✓ 已完成"; }

  .field { margin-top: 12px; }
  .field > label, .field > .lab { display: block; margin-bottom: 6px; font-size: .9rem; font-weight: 500; color: var(--muted); }
  input[type="text"], select {
    width: 100%; height: 48px; padding: 0 14px; font: inherit; color: var(--ink);
    background: var(--field); border: 1.5px solid var(--line); border-radius: 10px;
  }
  input[type="text"]::placeholder { color: var(--muted); opacity: .7; }
  select {
    -webkit-appearance: none; appearance: none; padding-right: 40px;
    background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 20px) 21px, calc(100% - 14px) 21px;
    background-size: 6px 6px; background-repeat: no-repeat;
  }
  select option { color: #17212b; background: #ffffff; }
  input:focus-visible, select:focus-visible { outline: 3px solid var(--brand); outline-offset: 1px; border-color: var(--brand); }

  /* 檢核狀態：三選一按鈕，選中時依狀態變色 */
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .seg label { position: relative; display: block; cursor: pointer; }
  .seg input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .seg span {
    display: block; padding: 11px 4px; text-align: center; font-weight: 500; font-size: .95rem;
    background: var(--field); border: 1.5px solid var(--line); border-radius: 10px; color: var(--ink);
  }
  .seg input:focus-visible + span { outline: 3px solid var(--brand); outline-offset: 2px; }
  .seg input:checked + span::before { content: "✓ "; }
  .seg input:checked + span { font-weight: 700; }
  .seg .yes  input:checked + span { background: var(--ok-bg);   border-color: var(--ok);   color: var(--ok); }
  .seg .no   input:checked + span { background: var(--warn-bg); border-color: var(--warn); color: var(--warn); }
  .seg .none input:checked + span { background: var(--none-bg); border-color: var(--none); color: var(--none); }

  /* 底部送出列 */
  .actions {
    position: sticky; bottom: 0; z-index: 5;
    padding: 28px 0 calc(14px + env(safe-area-inset-bottom, 0px));
    background: linear-gradient(to top, var(--bg) 62%, transparent);
  }
  #status { margin: 0 0 8px; min-height: 1.7em; font-weight: 700; font-size: .95rem; }
  #status.ok { color: var(--ok); }
  #status.err { color: var(--err); }
  button {
    width: 100%; height: 52px; font: inherit; font-size: 1.05rem; font-weight: 700; letter-spacing: .08em;
    color: var(--brand-ink); background: var(--brand); border: 0; border-radius: 12px; cursor: pointer;
  }
  button:hover:not(:disabled) { filter: brightness(1.08); }
  button:focus-visible { outline: 3px solid var(--brand); outline-offset: 3px; }
  button:disabled { opacity: .55; cursor: not-allowed; }

  @media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
  @media (max-width: 420px) { h1 { font-size: 1.5rem; } .sec { padding: 12px 14px 16px; } }
</style>
</head>

<main class="wrap">
  <form id="f" novalidate>
    <section class="sec" id="ceBox">
      <div class="sec-h"><h2>員工資料</h2></div>
      <div class="field">
        <label for="ce">CE:</label>
        <input type="text" id="ce" autocomplete="off" placeholder="請輸入員工編號">
      </div>
    </section>

    <div id="list"></div>

    <div class="actions">
      <p id="status" role="status" aria-live="polite"></p>
      <button type="submit" id="btn">送出回覆</button>
    </div>
  </form>
</main>

<script>
  // ====== 設定區 ======
  // 表單網址：把 viewform 換成 formResponse
  const FORM_URL = "https://docs.google.com/forms/d/e/1FAIpQLSdvtYjh76Ugcj2nIVPSQF3OZEXqHF2lg7vj3dYC7VDbM8v09w/formResponse";

  // 員工編號（CE:）對應的欄位代碼
  const EMPLOYEE_ENTRY = "entry.168967522";

  // type: "check" = 序號 + 單選（有檢核／尚未檢核／無備品）
  //       "qty"   = 只有數量下拉選單 0~5（不含序號）
  // serial / answer 為 Google 表單對應的欄位代碼（entry.數字）
  const DEVICES = [
    { name: "CZ 讀卡機", type: "check", serial: "entry.1397087108", answer: "entry.348032795" },
    { name: "CZ 明細機", type: "check", serial: "entry.1743992472", answer: "entry.64948247" },
    { name: "VS 讀卡機", type: "check", serial: "entry.258843963", answer: "entry.885322871" },
    { name: "SR 讀卡機", type: "check", serial: "entry.1346536862", answer: "entry.436912223" },
    { name: "SR 明細機", type: "check", serial: "entry.1873438707", answer: "entry.162400452" },
    { name: "DVR", type: "check", serial: "entry.925597810", answer: "entry.1260991549" },
    { name: "EPP", type: "qty", answer: "entry.1767127710" }
  ];

  // 選項文字（必須與 Google 表單中的選項文字完全相同）
  const OPT_YES  = "有檢核";
  const OPT_NO   = "尚未檢核";
  const OPT_NONE = "無備品";
  const QTY_MAX  = 5;

  // true：每項設備都必填；false：可留空，但填了其中一欄就需完整填寫
  const REQUIRE_ALL = true;

  // 除錯模式：true 時改成在「新分頁」送出，可直接看到 Google 回傳的畫面
  // 找出問題後請改回 false
  const DEBUG = false;
  // ====================

  const list = document.getElementById("list");
  const f = document.getElementById("f");
  const btn = document.getElementById("btn");
  const status = document.getElementById("status");
  const ceBox = document.getElementById("ceBox");
  const ceInput = document.getElementById("ce");
  const pn = document.getElementById("pn");
  const pbar = document.getElementById("pbar");
  document.getElementById("pt").textContent = DEVICES.length;

  DEVICES.forEach((d, i) => {
    const sec = document.createElement("section");
    sec.className = "sec";

    const serialField = d.type === "qty" ? "" : `
      <div class="field">
        <label for="s${i}">序號：</label>
        <input type="text" id="s${i}" autocomplete="off" placeholder="請輸入序號">
      </div>`;

    let second;
    if (d.type === "qty") {
      let opts = '<option value="" selected disabled>請選擇</option>';
      for (let q = 0; q <= QTY_MAX; q++) opts += `<option value="${q}">${q}</option>`;
      second = `
        <div class="field">
          <label for="a${i}">數量</label>
          <select id="a${i}">${opts}</select>
        </div>`;
    } else {
      second = `
        <div class="field">
          <span class="lab" id="l${i}">檢核狀態</span>
          <div class="seg" role="radiogroup" aria-labelledby="l${i}">
            <label class="yes"><input type="radio" name="a${i}" value="${OPT_YES}"><span>${OPT_YES}</span></label>
            <label class="no"><input type="radio" name="a${i}" value="${OPT_NO}"><span>${OPT_NO}</span></label>
            <label class="none"><input type="radio" name="a${i}" value="${OPT_NONE}"><span>${OPT_NONE}</span></label>
          </div>
        </div>`;
    }

    sec.innerHTML = `<div class="sec-h"><h2>${d.name}</h2><span class="badge"></span></div>${serialField}${second}`;
    d.box = sec;
    list.appendChild(sec);
  });

  function collect() {
    return DEVICES.map((d, i) => {
      const serial = d.type === "qty" ? "" : f.querySelector("#s" + i).value.trim();
      let answer = "";
      if (d.type === "qty") {
        answer = f.querySelector("#a" + i).value;
      } else {
        const r = f.querySelector(`input[name="a${i}"]:checked`);
        answer = r ? r.value : "";
      }
      return { d, serial, answer };
    });
  }

  // 判斷單一設備是否填寫有誤
  function isBad({ d, serial, answer }) {
    const filled = serial !== "" || answer !== "";
    if (!REQUIRE_ALL && !filled) return false;
    if (d.type === "qty") return answer === "";                     // 數量必選
    return answer === "" || (serial === "" && answer !== OPT_NONE); // 無備品時序號可留空
  }

  // 更新完成狀態（左側色條、進度）
  function refresh() {
    let n = 0;
    collect().forEach((row) => {
      const filled = row.serial !== "" || row.answer !== "";
      const bad = isBad(row);
      const done = filled && !bad;
      row.d.box.classList.toggle("done", done);
      if (!bad) row.d.box.classList.remove("invalid");
      if (done) n++;
    });
    const ceFilled = ceInput.value.trim() !== "";
    ceBox.classList.toggle("done", ceFilled);
    if (ceFilled) ceBox.classList.remove("invalid");
    pn.textContent = n;
    pbar.style.width = (n / DEVICES.length * 100) + "%";
  }
  f.addEventListener("input", refresh);
  f.addEventListener("change", refresh);

  f.addEventListener("submit", async (e) => {
    e.preventDefault();
    status.className = "";
    const ce = ceInput.value.trim();
    ceBox.classList.toggle("invalid", ce === "");
    if (ce === "") {
      status.textContent = "請先輸入員工編號（CE:）。";
      status.className = "err";
      ceInput.focus();
      return;
    }
    const rows = collect();
    let firstBad = null, anyFilled = false;

    rows.forEach((row) => {
      if (row.serial !== "" || row.answer !== "") anyFilled = true;
      const bad = isBad(row);
      row.d.box.classList.toggle("invalid", bad);
      if (bad && !firstBad) firstBad = row.d;
    });

    if (firstBad || !anyFilled) {
      status.textContent = firstBad
        ? `請完整填寫「${firstBad.name}」的內容。`
        : "請至少填寫一項設備。";
      status.className = "err";
      if (firstBad) firstBad.box.scrollIntoView({ behavior: "smooth", block: "center" });
      return;
    }

    btn.disabled = true;
    status.textContent = "送出中…";
    try {
      const body = new URLSearchParams();
      body.append(EMPLOYEE_ENTRY, ce);
      rows.forEach(({ d, serial, answer }) => {
        if (serial !== "") body.append(d.serial, serial);
        if (answer !== "") body.append(d.answer, answer);
      });
      if (DEBUG) {
        const tmp = document.createElement("form");
        tmp.method = "POST"; tmp.action = FORM_URL; tmp.target = "_blank"; tmp.style.display = "none";
        body.forEach((v, k) => {
          const inp = document.createElement("input");
          inp.type = "hidden"; inp.name = k; inp.value = v;
          tmp.appendChild(inp);
        });
        document.body.appendChild(tmp); tmp.submit(); tmp.remove();
        status.textContent = "除錯模式：已在新分頁送出，請查看 Google 回傳的畫面。";
        status.className = "ok";
        return;
      }
      // Google 表單不允許跨網域讀取回應，所以使用 no-cors；請求仍會成功送達
      await fetch(FORM_URL, { method: "POST", mode: "no-cors", body });
      status.textContent = "已送出，謝謝你的回覆！";
      status.className = "ok";
      f.reset();
      refresh();
      window.scrollTo({ top: 0, behavior: "smooth" });
    } catch (err) {
      status.textContent = "送出失敗，請檢查網路後再試一次。";
      status.className = "err";
    } finally {
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
